name: erp_daging_import
description: "ERP Supplier Daging Import Sampora Banten - Production Offline-First V4.3"
publish_to: "none"
version: 4.3.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Local Database: Drift + SQLCipher (Encrypted SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlcipher_flutter_libs: ^0.5.4
  sqlite3: ^2.4.4
  path_provider: ^2.1.2
  path: ^1.9.0

  # Security & Key Management & Environment Isolation
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  flutter_dotenv: ^5.1.0

  # Network & Cloud Sync
  http: ^1.2.1
  supabase_flutter: ^2.5.6
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  intl: ^0.19.0

  # Hardware: Thermal Printer & Camera OCR
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.2
  camera: ^0.11.0+1
  flutter_image_compress: ^2.3.0

  # Document Generation & Sharing
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/templates/
