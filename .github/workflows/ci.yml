name: ERP DAGING CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  web-pwa:
    name: Web PWA checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run engine tests
        run: bun run test
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Commit refreshed Bun lockfile on hardening branch
        if: github.ref == 'refs/heads/fix/production-readiness-phase-1'
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun.lock for current dependencies"
          git push
