name: ERP DAGING CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Upload production PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-daging-pwa-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Build production container image
        run: docker build --pull=false -t erp-daging:ci .
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright
          npx playwright install --with-deps chromium
      - name: Test IndexedDB restore in native Chromium
        run: node scripts/run-indexeddb-browser-test.mjs

  android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.2
        with:
          packages: platform-tools
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Build web assets for native wrapper
        run: bun run build
        env:
          VITE_CAPACITOR_APP: 'true'
      - name: Install Capacitor Android tooling
        run: npm install --no-save --package-lock=false --legacy-peer-deps @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Sync web assets into Android wrapper
        run: npx cap sync android
      - name: Keep the project minimum Android version at API 26
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/variables.gradle')
          content = path.read_text()
          old = 'minSdkVersion = 24'
          if old not in content:
              raise SystemExit('Expected Capacitor 8 minSdkVersion declaration was not found; inspect generated Android template.')
          path.write_text(content.replace(old, 'minSdkVersion = 26', 1))
          PY
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: erp-daging-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
