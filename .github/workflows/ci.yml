name: ERP DAGING CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Upload production PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-daging-pwa-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Build production container image
        run: docker build --pull=false -t erp-daging:ci .
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright
          npx playwright install --with-deps chromium
      - name: Test IndexedDB restore in native Chromium
        run: node scripts/run-indexeddb-browser-test.mjs
